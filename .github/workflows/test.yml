name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-lock-platforms:
    name: Analyze lock (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test native analyze lock
        run: pnpm exec vitest run tests/core/analyze-lifecycle-lock.test.ts

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The C# semantic rules run in an out-of-process .NET Roslyn host. Without
      # the SDK + a built host, every C# host test skips and analyze-csharp fails
      # (the pipeline is host-required for C#). Build it so C# is actually tested.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Build C# Roslyn host
        run: dotnet build -c Release tools/csharp-roslyn-host

      - name: Run tests
        run: pnpm test
